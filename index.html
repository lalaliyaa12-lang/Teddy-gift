<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Favorite Fool 🤎</title>

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;700&family=Pacifico&display=swap" rel="stylesheet">

<style>
body{
margin:0;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:#F8F3EC;
font-family:Quicksand,sans-serif;
overflow:hidden;
}

.container{
text-align:center;
padding:30px;
}

h1{
font-family:Pacifico;
font-size:42px;
color:#6d4c41;
}

p{
font-size:20px;
color:#795548;
margin:20px;
}

button{
padding:15px 35px;
font-size:20px;
border:none;
border-radius:40px;
background:#8d6e63;
color:white;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.05);
}

.heart{
position:absolute;
font-size:20px;
animation:float 8s linear infinite;
opacity:.8;
}

@keyframes float{
0%{
transform:translateY(100vh);
}
100%{
transform:translateY(-120vh);
}
}
</style>
</head>

<body>

<div class="container">

<h1>Hi, My Favorite Fool 🤎</h1>

<p>I made a tiny surprise just for you... 😝</p>

<button onclick="gift()">Open Gift 🎁</button>

</div>

<script>

function gift(){

document.body.innerHTML=`

<div style="display:flex;justify-content:center;align-items:center;height:100vh;flex-direction:column;text-align:center;background:#F8F3EC;">

<div style="font-size:120px;">🐱</div>

<h1 style="font-family:Pacifico;color:#6d4c41;">
Why do you even need a gift...
</h1>

<p style="font-size:24px;color:#795548;">
when you already have me in your life? 😝🤎
</p>

<button onclick="alert('Okay okay 😂 Next we'll open the bouquet! 💐')">
Okay okay... Show me the real gifts!
</button>

</div>

`;

}

for(let i=0;i<40;i++){

let heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="🤎";

heart.style.left=Math.random()*100+"vw";

heart.style.animationDuration=(Math.random()*5+5)+"s";

heart.style.fontSize=(Math.random()*18+15)+"px";

document.body.appendChild(heart);

}

</script>

</body>
</html>
